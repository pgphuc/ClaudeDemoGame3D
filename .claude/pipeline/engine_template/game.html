<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Archero Demo 3D</title>
<style>
  /* ---- Vỏ ngoài: nền tối, letterbox khung dọc 9:16 ---- */
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0d12;overflow:hidden;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#11141c;box-shadow:0 0 40px rgba(0,0,0,.8);overflow:hidden;}
  #cv{display:block;width:100%;height:100%;}

  /* ---- HUD (DOM overlay) — [MOD-6 v2] dựng theo Refs/Layout_1.png ---- */
  #hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
  .hudTop{position:absolute;left:0;top:0;width:100%;padding:8px 10px 6px;box-sizing:border-box;
    background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,.28) 62%,rgba(0,0,0,0));}

  /* Hàng 1: nút Pause (trái) | Lv + thanh XP (giữa) | coin (phải) */
  .topRow{display:flex;align-items:center;gap:9px;}

  /* (a) Nút Pause */
  #btnPause{pointer-events:auto;cursor:pointer;flex:0 0 auto;
    width:38px;height:32px;border:0;border-radius:16px;padding:0;
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:rgba(14,18,28,.78);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);}
  #btnPause i{display:block;width:5px;height:14px;border-radius:2px;background:#fff;}
  #btnPause:active{filter:brightness(.8);}

  /* (b) Lv + thanh XP tới mốc kế */
  .xpWrap{position:relative;flex:1 1 auto;min-width:0;height:32px;}
  .xpTrack{position:absolute;left:0;right:0;top:11px;height:17px;border-radius:9px;
    background:rgba(10,14,22,.8);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);overflow:hidden;}
  .xpTrack > i{display:block;height:100%;width:0%;border-radius:9px;
    background:linear-gradient(180deg,#ffd75e,#f5a316);transition:width .12s linear;}
  #lvLine{position:absolute;left:50%;top:-1px;transform:translateX(-50%);
    padding:1px 12px;border-radius:9px;background:rgba(10,14,22,.92);
    font-size:12px;font-weight:800;letter-spacing:.4px;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.6);}

  /* (c) Bộ đếm coin — placeholder tĩnh, KHÔNG có cơ chế nhặt coin */
  .coinWrap{flex:0 0 auto;display:flex;align-items:center;gap:5px;}
  .coinIcon{display:block;width:22px;height:22px;transform:rotate(45deg);border-radius:5px;
    background:linear-gradient(160deg,#ffe680,#f0a70e);box-shadow:inset 0 0 0 2px rgba(120,72,0,.55);}
  #coinLine{font-size:15px;font-weight:800;text-shadow:0 1px 2px #000;}

  /* (d) Icon quái + số quái còn sống của wave hiện tại */
  .midRow{display:flex;justify-content:center;margin-top:6px;}
  .mobPill{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 3px;border-radius:14px;
    background:rgba(10,14,22,.8);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);}
  .mobIcon{display:block;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#ff8a76,#c62f22 72%);
    box-shadow:inset 0 0 0 2px #ffd9a0;}
  #enemyLine{font-size:15px;font-weight:800;min-width:14px;text-align:center;text-shadow:0 1px 2px #000;}

  /* (e) Thanh Đợt: 5 icon kiếm chéo */
  .waveRow{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;}
  .wv{position:relative;width:30px;height:30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,14,22,.72);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);}
  .wv svg{width:19px;height:19px;display:block;}
  .wv .no{position:absolute;right:1px;bottom:0;font-size:9px;font-weight:800;
    text-shadow:0 1px 2px #000;line-height:1;}
  .wv .tick{position:absolute;left:0;top:0;width:100%;height:100%;
    display:none;align-items:center;justify-content:center;
    font-size:17px;font-weight:900;color:#7ef09a;text-shadow:0 1px 3px #000;}
  /* đợt CHƯA TỚI: mờ */
  .wv.upcoming{opacity:.34;}
  /* đợt ĐÃ DỌN XONG: đánh dấu tick, icon chìm xuống */
  .wv.done{opacity:.8;background:rgba(20,52,32,.8);box-shadow:inset 0 0 0 1.5px rgba(126,240,154,.45);}
  .wv.done svg{opacity:.22;}
  .wv.done .tick{display:flex;}
  /* đợt HIỆN TẠI: sáng nổi bật */
  .wv.current{background:linear-gradient(180deg,#ffd75e,#f0920e);
    box-shadow:0 0 12px rgba(255,196,60,.85),inset 0 0 0 2px #fff3c4;transform:scale(1.16);}
  .wv.current svg{filter:drop-shadow(0 1px 1px rgba(90,40,0,.7));}
  .wv.current .no{color:#3a2200;text-shadow:0 1px 0 rgba(255,240,190,.8);}

  /* ---- Thanh HP hero: bám trên đầu hero (theo Layout_1.png gốc) ---- */
  #heroBar{position:absolute;left:0;top:0;width:60px;height:11px;
    transform:translate(-50%,-50%);border-radius:6px;
    background:rgba(8,12,18,.75);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55);
    overflow:hidden;display:none;}
  #heroBar.on{display:block;}
  #heroHPFill{position:absolute;left:1px;top:1px;bottom:1px;width:100%;border-radius:5px;
    background:linear-gradient(180deg,#9bf58c,#28b552);transition:width .1s linear;}
  #heroHPText{position:absolute;left:0;top:0;width:100%;height:100%;line-height:11px;
    text-align:center;font-size:8.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;}

  /* ---- Lớp hiệu ứng số damage nổi ---- */
  #fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
  .dmg{position:absolute;font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000;
    transform:translate(-50%,-50%);white-space:nowrap;}
  .dmg.hero{color:#ff8080;}
  .dmg.heal{color:#8effa8;}

  /* ---- Overlay chung ---- */
  .ov{position:absolute;left:0;top:0;width:100%;height:100%;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(4,6,12,.78);pointer-events:auto;}
  .ov.show{display:flex;}
  .ovTitle{font-size:30px;font-weight:900;margin-bottom:16px;text-shadow:0 3px 8px #000;text-align:center;}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:10px;padding:12px 26px;
    font-size:16px;font-weight:800;color:#08131f;background:linear-gradient(180deg,#ffe27a,#ffb32e);
    box-shadow:0 4px 0 #a8721a;font-family:inherit;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a8721a;}

  /* ---- Overlay chọn card khi lên cấp (MOD-3: 1 màu rarity duy nhất) ---- */
  #ovCard .ovTitle{font-size:24px;margin-bottom:14px;}
  #cards{display:flex;flex-direction:column;gap:12px;width:78%;}
  .card{pointer-events:auto;cursor:pointer;border-radius:12px;padding:12px 14px;
    background:linear-gradient(180deg,#2b3f6b,#1b2947);border:2px solid #5b8ddb;
    box-shadow:0 0 14px rgba(91,141,219,.45);}
  .card:hover{filter:brightness(1.15);}
  .card h4{margin:0 0 4px;font-size:16px;font-weight:800;color:#cfe4ff;}
  .card p{margin:0;font-size:12.5px;opacity:.88;line-height:1.35;}
  #ovEnd .sub{font-size:14px;opacity:.85;margin-bottom:18px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hudTop" id="hudTop">
      <div class="topRow">
        <button id="btnPause" type="button" title="Tạm dừng"><i></i><i></i></button>
        <div class="xpWrap">
          <div class="xpTrack"><i id="xpFill"></i></div>
          <div id="lvLine">Lv.1</div>
        </div>
        <div class="coinWrap"><span class="coinIcon"></span><span id="coinLine">0</span></div>
      </div>
      <div class="midRow">
        <div class="mobPill"><span class="mobIcon"></span><span id="enemyLine">0</span></div>
      </div>
      <div class="waveRow" id="waveRow"><!-- 5 icon kiếm chéo do syncHUD() dựng --></div>
    </div>

    <div id="fx"></div>
    <div id="heroBar"><span id="heroHPFill"></span><span id="heroHPText">1000</span></div>
  </div>

  <!-- Overlay tạm dừng [MOD-6 v2] -->
  <div class="ov" id="ovPause">
    <div class="ovTitle">TẠM DỪNG</div>
    <button class="btn" id="btnResume">Tiếp tục</button>
  </div>

  <!-- Overlay lên cấp: 3 card -->
  <div class="ov" id="ovCard">
    <div class="ovTitle">TĂNG CẤP!</div>
    <div id="cards"></div>
  </div>

  <!-- Overlay Thắng / Game Over -->
  <div class="ov" id="ovEnd">
    <div class="ovTitle" id="endTitle">CHIẾN THẮNG</div>
    <div class="sub" id="endSub"></div>
    <button class="btn" id="btnReplay">Chơi lại</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/fflate.min.js"></script>
<script src="lib/NURBSUtils.js"></script>
<script src="lib/NURBSCurve.js"></script>
<script src="lib/FBXLoader.js"></script>
<script src="assets_fbx.js"></script>
<script src="game_core.js"></script>
</body>
</html>
