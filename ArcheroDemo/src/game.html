<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Archero Demo 3D</title>
<style>
  /* ---- Vỏ ngoài: nền tối, letterbox khung dọc 9:16 ---- */
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0d12;overflow:hidden;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#11141c;box-shadow:0 0 40px rgba(0,0,0,.8);overflow:hidden;}
  #cv{display:block;width:100%;height:100%;}

  /* ---- HUD (DOM overlay) ---- */
  #hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
  .hudTop{position:absolute;left:0;top:0;width:100%;padding:8px 10px;box-sizing:border-box;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .tag{font-size:13px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;}
  .bar{position:relative;flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.16);
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}
  .bar > i{display:block;height:100%;width:0%;border-radius:6px;transition:width .12s linear;}
  #xpFill{background:linear-gradient(90deg,#6fd3ff,#3aa0ff);}
  #hpFill{background:linear-gradient(90deg,#7ef07e,#25c25a);}
  #waveLine{font-size:15px;font-weight:800;letter-spacing:.3px;}
  #enemyLine{font-size:13px;opacity:.92;}

  /* ---- Lớp hiệu ứng số damage nổi ---- */
  #fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
  .dmg{position:absolute;font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000;
    transform:translate(-50%,-50%);white-space:nowrap;}
  .dmg.hero{color:#ff8080;}
  .dmg.heal{color:#8effa8;}

  /* ---- Overlay chung ---- */
  .ov{position:absolute;left:0;top:0;width:100%;height:100%;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(4,6,12,.78);pointer-events:auto;}
  .ov.show{display:flex;}
  .ovTitle{font-size:30px;font-weight:900;margin-bottom:16px;text-shadow:0 3px 8px #000;text-align:center;}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:10px;padding:12px 26px;
    font-size:16px;font-weight:800;color:#08131f;background:linear-gradient(180deg,#ffe27a,#ffb32e);
    box-shadow:0 4px 0 #a8721a;font-family:inherit;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a8721a;}

  /* ---- Overlay chọn card khi lên cấp (MOD-3: 1 màu rarity duy nhất) ---- */
  #ovCard .ovTitle{font-size:24px;margin-bottom:14px;}
  #cards{display:flex;flex-direction:column;gap:12px;width:78%;}
  .card{pointer-events:auto;cursor:pointer;border-radius:12px;padding:12px 14px;
    background:linear-gradient(180deg,#2b3f6b,#1b2947);border:2px solid #5b8ddb;
    box-shadow:0 0 14px rgba(91,141,219,.45);}
  .card:hover{filter:brightness(1.15);}
  .card h4{margin:0 0 4px;font-size:16px;font-weight:800;color:#cfe4ff;}
  .card p{margin:0;font-size:12.5px;opacity:.88;line-height:1.35;}
  #ovEnd .sub{font-size:14px;opacity:.85;margin-bottom:18px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hudTop">
      <div class="row"><span class="tag" id="waveLine">Đợt 1/5</span>
                       <span class="tag" id="enemyLine">Quái còn 0</span></div>
      <div class="row"><span class="tag" id="lvLine">Lv.1</span>
                       <span class="bar"><i id="xpFill"></i></span>
                       <span class="tag" id="xpLine">0/5</span></div>
      <div class="row"><span class="tag">HP</span>
                       <span class="bar"><i id="hpFill"></i></span>
                       <span class="tag" id="hpLine">1000</span></div>
    </div>
    <div id="fx"></div>
  </div>

  <!-- Overlay lên cấp: 3 card -->
  <div class="ov" id="ovCard">
    <div class="ovTitle">TĂNG CẤP!</div>
    <div id="cards"></div>
  </div>

  <!-- Overlay Thắng / Game Over -->
  <div class="ov" id="ovEnd">
    <div class="ovTitle" id="endTitle">CHIẾN THẮNG</div>
    <div class="sub" id="endSub"></div>
    <button class="btn" id="btnReplay">Chơi lại</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/fflate.min.js"></script>
<script src="lib/NURBSUtils.js"></script>
<script src="lib/NURBSCurve.js"></script>
<script src="lib/FBXLoader.js"></script>
<script src="assets_fbx.js"></script>
<script src="game_core.js"></script>
</body>
</html>
